name: 每日抓取

on:
  schedule:
    # UTC 22:00 = 台北時間隔天早上 06:00
    # ⚠ GitHub 的排程不保證準時,尖峰時可能延後幾十分鐘,這是正常的
    - cron: "0 22 * * *"
  workflow_dispatch:        # 也可以在 Actions 頁面手動按一下立刻跑

permissions:
  contents: write           # 要把抓到的資料寫回 repo

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取今日資料
        id: fetch
        continue-on-error: true   # 有警告也要往下走,務必留下紀錄
        run: python3 scripts/fetch.py

      - name: 寫回 repo
        # 就算上一步有警告也照樣執行:
        # (1) 錯誤狀態要進到畫面上,使用者才看得到紅色警告
        # (2) 每天有 commit 才能避開 GitHub「60 天沒動靜就停用排程」
        if: always()
        run: |
          git config user.name  "webtoon-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/thumbs
          if git diff --staged --quiet; then
            echo "沒有任何變更(這不該發生,每日快照應該一定會新增)"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date +%Y-%m-%d)"
            git push
          fi

      - name: 抓取有警告就讓這次標紅
        # 放最後才失敗,確保上面的資料已經寫回去了
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::抓取有警告,資料已寫回但請檢查 —— 打開 App 的『設定』分頁可看到詳細警告"
          exit 1
